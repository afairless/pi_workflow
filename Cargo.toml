[package]
name = "pi-plan"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
description = "Deterministic Rust orchestrator for the TODO.md workflow"
license = "MIT"

[dependencies]
tokio = { version = "=1.53.1", default-features = false, features = [
    "process",
    "io-util",
    "io-std",
    "time",
    "sync",
    "macros",
    "rt-multi-thread",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
clap = { version = "=4.6.6", features = ["derive"] }
thiserror = "=2.0.20"
anyhow = "=1.0.104"
sha2 = "=0.11.0"

[dev-dependencies]
proptest = "=1.11.0"

[profile.release]
lto = "thin"